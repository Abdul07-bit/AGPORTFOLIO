[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: serve index.html for client-side routes such as /work/datafusion.
# Functions with their own `path` (/api/...) take precedence over this rule.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
